# Source: fluid/templates/csi/daemonset.yaml
kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: csi-nodeplugin-fluid
  namespace: fluid-system
spec:
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: csi-nodeplugin-fluid
  template:
    metadata:
      labels:
        app: csi-nodeplugin-fluid
    spec:
      serviceAccountName: fluid-csi
      #priorityClassName: system-node-critical
      hostPID: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: type
                operator: NotIn
                values:
                - virtual-kubelet
      containers:
      - name: node-driver-registrar
        image: registry.aliyuncs.com/fluid/csi-node-driver-registrar:v2.3.0
        args:
          - --v=5
          - --csi-address=/var/lib/kubelet/csi-plugins/fuse.csi.fluid.io/csi.sock
          - --kubelet-registration-path=/var/lib/kubelet/csi-plugins/fuse.csi.fluid.io/csi.sock
        env:
          - name: KUBE_NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
        volumeMounts:
          - name: kubelet-dir
            mountPath: /var/lib/kubelet
            mountPropagation: "HostToContainer"
          - name: registration-dir
            mountPath: /registration
      - name: plugins
        securityContext:
          privileged: true
          runAsUser: 0
          capabilities:
            add: ["SYS_ADMIN"]
          allowPrivilegeEscalation: true
        image: registry.aliyuncs.com/fluid/fluid-csi:v1.0.4-9857af7
        command: ["/usr/local/bin/entrypoint.sh"]
        args:
          - "--nodeid=$(NODE_ID)"
          - "--endpoint=$(CSI_ENDPOINT)"
          - --v=5
          - --feature-gates=FuseRecovery=false
          - --prune-fs=fuse.alluxio-fuse,fuse.jindofs-fuse,fuse.juicefs,fuse.goosefs-fuse,ossfs,alifuse.aliyun-alinas-efc
          - --prune-path=/runtime-mnt
          - "--pprof-addr=:6060"
        env:
          - name: NODE_ID
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: NODE_IP
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
          - name: MOUNT_ROOT
            value: "/runtime-mnt"
          - name: REVOCER_WARNING_THRESHOLD
            value: "50"
          - name: ALLOW_PATCH_STALE_NODE
            value: "true"
          - name: KUBELET_ROOTDIR
            value: /var/lib/kubelet
          - name: CSI_ENDPOINT
            value: unix:///var/lib/kubelet/csi-plugins/fuse.csi.fluid.io/csi.sock
          - name: NODEPUBLISH_METHOD
            value: bindMount
        imagePullPolicy: "IfNotPresent"
        volumeMounts:
          - name: plugin-dir
            mountPath: /plugin
          - name: kubelet-dir
            mountPath: /var/lib/kubelet
            mountPropagation: "Bidirectional"
          - name: fluid-src-dir
            mountPath: "/runtime-mnt"
            mountPropagation: "HostToContainer"
          - name: kubelet-kube-config
            mountPath: /etc/kubernetes/kubelet.conf
            mountPropagation: "HostToContainer"
            readOnly: true
          # Check subdirectory to avoid looping bind mounts
          - name: updatedb-conf
            mountPath: /host-etc/updatedb.conf
          - name: updatedb-conf-bak
            mountPath: /host-etc/updatedb.conf.bak
      volumes:
        - name: kubelet-dir
          hostPath:
            path: "/var/lib/kubelet"
            type: Directory
        - name: plugin-dir
          hostPath:
            path: /var/lib/kubelet/plugins/csi-fluid-plugin
